# Builds The Endgame is Me for Steam on Windows, macOS and Linux (see the-endgame-is-me-desktop/README.md).
# Each platform builds on its own runner, because a Mac app has to be made (and signed) on a Mac.
# The three folders come out as run artifacts, ready for steam/upload.mjs.
name: Endgame desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main, endgame-desktop]
    paths: ['the-endgame-is-me/**', 'the-endgame-is-me-desktop/**', 'splash.js', '.github/workflows/endgame-desktop.yml']

permissions:
  contents: read
  id-token: write   # lets the Windows job sign in to Azure for code signing, with no stored password

concurrency:
  group: endgame-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: 'build:win', folder: win-unpacked, name: windows }
          - { os: macos-latest, script: 'build:mac', folder: mac-universal, name: mac }
          - { os: ubuntu-latest, script: 'build:linux', folder: linux-unpacked, name: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: the-endgame-is-me-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: the-endgame-is-me-desktop/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Apple Silicon will not open an app whose signature no longer matches it, so the Mac build gets an ad-hoc
      # signature (no Apple account needed). Steam does not quarantine what it installs, so this is enough to run.
      - name: Ad-hoc sign the Mac app
        if: matrix.name == 'mac'
        run: |
          ls dist/mac-universal
          APP=$(ls -d dist/mac-universal/*.app | head -1)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
      # Windows: sign the .exe and its DLLs with Azure Trusted Signing (account vibecodedslopware, resource group
      # slopware-signing). Off until the repository variable SIGNING_PROFILE names the certificate profile, which
      # Azure only issues after the identity check. GitHub signs in to Azure as the app slopware-github-signing
      # (AZURE_CLIENT_ID), trusted for pushes to main and endgame-desktop only.
      - name: Sign in to Azure
        if: matrix.name == 'windows' && vars.SIGNING_PROFILE != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the Windows build
        if: matrix.name == 'windows' && vars.SIGNING_PROFILE != ''
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: https://wus2.codesigning.azure.net/
          trusted-signing-account-name: vibecodedslopware
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: the-endgame-is-me-desktop/dist/win-unpacked
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      # zip here so the Mac app keeps its symlinks and permissions on the way through
      - name: Zip
        shell: bash
        run: |
          cd dist/${{ matrix.folder }}
          if [ "${{ matrix.name }}" = mac ]; then ditto -c -k --sequesterRsrc --keepParent "$(ls -d *.app | head -1)" ../../endgame-${{ matrix.name }}.zip
          elif [ "${{ matrix.name }}" = windows ]; then 7z a -tzip ../../endgame-${{ matrix.name }}.zip . > /dev/null
          else zip -qry --symlinks ../../endgame-${{ matrix.name }}.zip .; fi
      - uses: actions/upload-artifact@v4
        with:
          name: endgame-${{ matrix.name }}
          path: the-endgame-is-me-desktop/endgame-${{ matrix.name }}.zip
          if-no-files-found: error
