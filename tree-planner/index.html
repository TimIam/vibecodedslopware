<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christmas Tree Planner</title>
<meta name="description" content="Photograph your room to find where a Christmas tree fits, build and decorate a 3D tree from 15 real species and a dozen artificial ones, and scan your own ornaments to hang on it.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="stylesheet" href="/site-nav.css">
<style>
:root{--bg:#141210;--panel:#1d1a17;--panel2:#26221e;--line:#3b352e;--ink:#f3ece0;--dim:#b4a995;--muted:#8d8271;--red:#c3283a;--green:#2f8a4c;--gold:#e0b24f;--accent:#ffe397}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button,select,input{font:inherit;color:inherit}
.tabs{position:sticky;top:52px;z-index:20;display:flex;gap:4px;padding:6px 10px 0;background:linear-gradient(#1b2a20,#16201a);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs h1{margin:0 14px 0 4px;font-size:17px;align-self:center;white-space:nowrap;color:var(--accent);font-family:Georgia,serif}
.tabs button{border:1px solid transparent;border-bottom:0;background:none;padding:9px 14px;border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap;color:var(--dim);min-height:44px}
.tabs button[aria-selected=true]{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:600}
main{height:calc(100vh - 52px - 51px);height:calc(100dvh - 52px - 51px)}
main>section{height:100%}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px;white-space:nowrap}
.btn:hover{border-color:#6d6253}.btn.primary{background:#1f6b3a;border-color:#2f9a55}.btn.primary:hover{background:#25804a}
.btn.danger{border-color:#7a2b2b;color:#ffb3b3}.btn.small{padding:4px 9px;min-height:30px;font-size:13px}
.muted{color:var(--muted);font-size:12.5px}
select,input[type=text],input[type=number]{background:#0f0e0c;border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-height:34px;max-width:100%}
input.num{width:68px}
input[type=color]{width:38px;height:32px;border:1px solid var(--line);background:none;border-radius:6px;padding:2px}
.field{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0}
.field label{color:var(--dim);font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.radios,.checks{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0}
.radios label,.checks label{cursor:pointer}
/* ---------- builder ---------- */
#tab-builder{display:grid;grid-template-columns:minmax(300px,380px) 1fr;grid-template-rows:minmax(0,1fr)}
.b-left{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.ltabs{display:flex;border-bottom:1px solid var(--line)}
.ltab{flex:1;background:none;border:0;padding:10px 4px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;min-height:44px}
.ltab.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.lbody{padding:10px 14px 30px;overflow-y:auto;flex:1}
.info h2{margin:10px 0 0;font-family:Georgia,serif;font-size:22px}.latin{font-style:italic;color:var(--muted)}
.info h4{margin:14px 0 4px;color:var(--gold);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.info ul{margin:0;padding-left:18px}.info li{margin:3px 0}
.ratings{display:grid;gap:2px;margin:8px 0;padding:8px 10px;background:var(--panel2);border-radius:8px}
.stars{color:var(--gold);letter-spacing:2px}
.sec{border:1px solid var(--line);border-radius:9px;margin:8px 0;background:var(--panel2)}
.sec>summary{padding:9px 12px;cursor:pointer;font-weight:600;list-style:none}.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:'▸';float:right;color:var(--muted)}.sec[open]>summary::after{content:'▾'}
.secb{padding:0 12px 10px}
.sec.flat{padding:2px 12px 10px}.sec.flat h4{margin:10px 0 4px;color:var(--gold)}
.grid-btns{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{border:1px solid var(--line);background:#14120f;border-radius:999px;padding:5px 10px;cursor:pointer;font-size:12.5px;min-height:32px}
.chip.on{border-color:var(--gold);background:#3a2f17}
.chip.thumb{display:flex;align-items:center;gap:6px;border-radius:9px}.chip.thumb img{width:28px;height:28px;object-fit:contain}
.swatches{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #0006;cursor:pointer;padding:0}.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.strand{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12.5px}.strand span{flex:1}
.papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin:6px 0}
.paper{border:1px solid var(--line);background:none;border-radius:8px;padding:3px;cursor:pointer;font-size:11px;color:var(--dim)}
.paper img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;display:block}.paper.on{border-color:var(--gold);color:var(--ink)}
.giftlist{display:flex;flex-wrap:wrap;gap:5px}
.saved{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.saved .btns{display:flex;gap:4px;flex-wrap:wrap}
.b-right{display:flex;flex-direction:column;min-width:0;min-height:0}
.b-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.b-bar .grow{flex:1}.tools{display:flex;gap:4px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:#14120f;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px}.tool.on{border-color:var(--gold);background:#3a2f17}
.b-room-link{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 12px;background:#203626;border-bottom:1px solid #2f5a3a}
.view3d{position:relative;flex:1;min-height:0}
.view3d canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.topdown{position:absolute;left:10px;bottom:10px;background:#0d0c0bcc;border:1px solid var(--line);border-radius:10px;padding:6px;backdrop-filter:blur(4px)}
.tdhead{font-size:11px;color:var(--dim);margin:0 2px 4px}.td{display:block;width:200px;height:200px;cursor:pointer}
.rotbox{position:absolute;right:10px;top:10px;background:#0d0c0bcc;border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.rotbox input{width:170px;vertical-align:middle}.rotnote{color:var(--accent);font-size:11px}
.floatbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:min(640px,90%);background:#3a1414ee;border:1px solid #ff4a4a;border-radius:10px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:3}
.floatbar span{flex:1 1 260px}
.hint{position:absolute;right:10px;bottom:10px;font-size:11.5px;color:var(--muted);background:#0d0c0b99;padding:4px 8px;border-radius:6px}
/* ---------- room ---------- */
#tab-room{display:grid;grid-template-columns:1fr minmax(300px,380px);grid-template-rows:minmax(0,1fr)}
.r-stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px;gap:10px}
.stagebox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.empty{max-width:560px;text-align:center;padding:30px}.empty .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.layers{position:relative}.layers canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.layers .ov{touch-action:none;outline:none}.layers .gl{pointer-events:none}
.r-model{height:190px;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;flex:none}
.r-model .model3d{width:100%;height:100%;display:block}.mhead{position:absolute;left:8px;top:6px;font-size:12px;color:var(--dim);pointer-events:none}
.r-panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:6px 12px 30px}
.lm{display:flex;gap:6px;align-items:center;margin:4px 0}.lm select{flex:1}.lm.on select{border-color:var(--gold)}
.scale{padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}.scale .big{font-size:16px;font-weight:700;margin-top:4px}
.scale.warn{border-color:#a3741f}.scale.warn .big{color:#ffc35c}.scale.ok .big{color:#7ee29a}
.spot{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:5px 0;cursor:pointer}.spot:hover{border-color:var(--gold)}
.spot b{font-size:18px;margin-right:6px}
/* ---------- importer ---------- */
#tab-ornaments{overflow-y:auto;padding:12px}
.i-stage{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.i-pane{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:280px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.i-pane .pt{position:absolute;left:8px;top:6px;font-size:12px;color:var(--dim)}
.i-pane canvas{max-width:100%;max-height:420px;display:block}.i-pane canvas.prev{width:100%;height:100%;max-height:none;position:absolute;inset:0}
.i-empty{position:absolute;inset:0;background:var(--panel);padding:30px 24px;overflow:auto}.i-empty h2{margin-top:6px}.i-empty .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.i-ask{margin:12px 0;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:20px}.i-ask:empty{display:none}.i-ask .q{font-size:17px;font-weight:700;margin:10px 0 0}
.i-lib h3{margin:20px 0 6px;font-family:Georgia,serif}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:repeating-conic-gradient(#2a2622 0 25%,#3a3530 0 50%) 0 0/20px 20px;border-radius:6px}.card .btns{display:flex;gap:4px}
/* ---------- modal / toast ---------- */
.modal-back{position:fixed;inset:0;background:#000a;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px #000}
.modal h3{margin:0 0 8px;font-family:Georgia,serif;font-size:20px}.modal-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:14px}
.modal input[type=text]{width:100%}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:#2b261f;border:1px solid var(--gold);padding:9px 14px;border-radius:9px;z-index:300;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){
  main{height:auto}
  #tab-builder,#tab-room{display:flex;flex-direction:column;height:auto}
  .b-left{order:2;border-right:0;max-height:none}.b-right{order:1;height:78vh}
  .r-panel{border-left:0}.r-stage{padding:6px}.stagebox{min-height:50vh}
  .i-stage{grid-template-columns:1fr}.td{width:150px;height:150px}.rotbox input{width:120px}.hint{display:none}
}
</style>

</head>
