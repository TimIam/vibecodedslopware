<script>
(() => {
'use strict';
// Ant Farm. One file, no dependencies, plain WebGL2.
//
// URL hash (key=value joined with &):
//   host=saver|app|config   running inside AntFarm.scr / AntFarm.exe
//   views=x,y,w,h;...       monitor rectangles inside the canvas, in canvas pixels
//   primary=i               which of those views gets the controls
//   screens=x,y,w,h;...     monitors in screen coordinates, for one browser window stretched across them
//   pane=1&cid=..&wx&ww&wh  a window this page opened on another monitor
//   embed                   just the farm: no controls, no input
//
// One long, continuous farm: monitors sit side by side, left to right, tops aligned, so each one
// shows the surface and an ant leaving one edge arrives at the next monitor's edge.
const hash = {};
for (const kv of location.hash.slice(1).split('&')) { if (!kv) continue; const i = kv.indexOf('='); if (i < 0) hash[kv] = '1'; else hash[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); }
const HOST = hash.host || '', IS_PANE = !!hash.pane, EMBED = !!hash.embed;
const LEADER = !IS_PANE;
const hostPost = (m) => { try { window.chrome.webview.postMessage(m); } catch (e) { if (m === 'exit') window.close(); } };
if (HOST) document.body.classList.add('host');
if (HOST === 'saver') document.body.classList.add('saver');
if (IS_PANE) document.body.classList.add('pane');
if (EMBED) document.body.classList.add('embed');

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, depth: true, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('fade').textContent = 'This needs WebGL2'; return; }
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

const TAU = Math.PI * 2, clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

// ---- settings
const SPECIES = {
  black:   { name: 'Black garden ant', body: [.030, .026, .024], gaster: [.022, .019, .019], legs: [.055, .040, .030], len: 1.00, gloss: 1.0 },
  red:     { name: 'Red harvester',    body: [.300, .085, .030], gaster: [.105, .040, .022], legs: [.270, .085, .035], len: 1.14, gloss: .9 },
  fire:    { name: 'Fire ant',         body: [.370, .135, .040], gaster: [.060, .030, .020], legs: [.330, .130, .045], len: .84,  gloss: 1.1 },
  carpenter: { name: 'Carpenter ant',  body: [.150, .045, .024], gaster: [.012, .011, .011], legs: [.120, .040, .022], len: 1.34, gloss: 1.2 },
  weaver:  { name: 'Golden weaver',    body: [.650, .330, .085], gaster: [.520, .270, .075], legs: [.620, .320, .090], len: 1.10, gloss: .8 },

  moon:   { name: 'Moonlit shelf', key: [.42, .54, .86], fill: [.12, .16, .28], bounce: [.09, .10, .15], skyT: [.012, .018, .04], skyB: [.05, .075, .15], bokeh: [.4, .55, 1.0], gain: .85 },
};
const SIZES = { small: 36, medium: 60, macro: 112 };
const FOODS = {
  sugar: { label: 'Sugar',  value: 1.0, amt: 26 },
  seeds: { label: 'Seeds',  value: 1.5, amt: 18 },
  honey: { label: 'Honey',  value: 2.2, amt: 34 },
  crumb: { label: 'Crumbs', value: 1.2, amt: 24 },
  water: { label: 'Water',  value: .15, amt: 18 },

const S = Object.assign({}, DEFAULTS);
try { Object.assign(S, JSON.parse(localStorage.getItem('antfarm.settings') || '{}')); } catch (e) {}
for (const [k, t] of [['species', SPECIES], ['soil', SOILS], ['light', LIGHTS], ['size', SIZES]]) if (!t[S[k]]) S[k] = DEFAULTS[k];
const saveSettings = () => { if (LEADER) try { localStorage.setItem('antfarm.settings', JSON.stringify(S)); } catch (e) {} };

// ---- views: which part of the world each monitor shows
// A view maps world [wx, wx+ww] x [0, wh] onto canvas rectangle cx,cy,cw,ch (canvas y grows down).
let views = [], W = 0, H = 0, unit = 1, antLen = 60, cell = 5, primaryView = 0;
let multi = null;     // set when this page has spread itself over other monitors
const parseRects = (t) => t.split(';').map(s => s.split(',').map(Number)).filter(r => r.length === 4 && r[2] > 0 && r[3] > 0);
const screenRects = hash.screens ? parseRects(hash.screens) : null;
const hostRects = hash.views ? hash.views.split(';').map(s => s.split(',').map(Number)).filter(r => r.length === 4 && r[2] > 0 && r[3] > 0) : null;
function layout() {
  let cw, ch;
  let useRects = hostRects;
  if (screenRects && screenRects.length) {
    const edge = (outerWidth - innerWidth) / 2, ox = screenX + edge, oy = screenY + (outerHeight - innerHeight) - edge;
    useRects = screenRects.map(r => [r[0] - ox, r[1] - oy, r[2], r[3]]);
  }
  if (useRects && useRects.length) {
    const rects = useRects.map((r, i) => ({ r, i })).sort((a, b) => a.r[0] - b.r[0]);
    if (screenRects) { cw = Math.round(innerWidth); ch = Math.round(innerHeight); }
    else { cw = Math.max(...useRects.map(r => r[0] + r[2])); ch = Math.max(...useRects.map(r => r[1] + r[3])); }
    let wx = 0; views = [];
    for (const { r, i } of rects) { views.push({ cx: r[0], cy: r[1], cw: r[2], ch: r[3], wx, ww: r[2], wh: r[3], src: i }); wx += r[2]; }
    W = wx; H = Math.max(...useRects.map(r => r[3]));
    primaryView = Math.max(0, views.findIndex(v => v.src === (+hash.primary || 0)));
  } else {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cw = Math.round(innerWidth * dpr); ch = Math.round(innerHeight * dpr);
    if (IS_PANE) { views = [{ cx: 0, cy: 0, cw, ch, wx: +hash.wx, ww: +hash.ww, wh: +hash.wh }]; W = +hash.ww + +hash.wx; H = +hash.wh; }
    else if (multi) { views = [{ cx: 0, cy: 0, cw, ch, wx: multi.wx, ww: multi.ww, wh: multi.wh }]; W = multi.W; H = multi.H; }
    else { views = [{ cx: 0, cy: 0, cw, ch, wx: 0, ww: cw, wh: ch }]; W = cw; H = ch; }
    primaryView = 0;
  }
  canvas.width = cw; canvas.height = ch;
  const cssK = cw / (canvas.clientWidth || cw), p = views[primaryView] || views[0], hud = document.getElementById('hud');
  hud.style.left = (p.cx / cssK) + 'px'; hud.style.top = (p.cy / cssK) + 'px'; hud.style.width = (p.cw / cssK) + 'px'; hud.style.height = ((p.ch / cssK) - (screenRects ? Math.max(48, screen.height - screen.availHeight) : 0)) + 'px';
}

// ---- shaders
function program(vs, fs) {
  const mk = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src.split('\n').slice(0, 3).join('\n')); return s; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i), name = a.name.replace('[0]', ''); u[name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
const HEAD = '#version 300 es\nprecision highp float;\nprecision highp int;\n';
const NOISE = `
float h12(vec2 p){vec3 a=fract(vec3(p.xyx)*.1031);a+=dot(a,a.yzx+33.33);return fract((a.x+a.y)*a.z);}
vec2 h22(vec2 p){vec3 a=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));a+=dot(a,a.yzx+33.33);return fract((a.xx+a.yz)*a.zy);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h12(i),h12(i+vec2(1,0)),f.x),mix(h12(i+vec2(0,1)),h12(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+vec2(17.1,9.2);a*=.5;}return s;}
`;
const FS_TRI = HEAD + 'const vec2 P[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3));void main(){gl_Position=vec4(P[gl_VertexID],0,1);}';

// The sand. Every grain is a Voronoi cell; a grain exists or doesn't according to the dig mask AT ITS
// CENTRE, so tunnel walls are made of whole grains instead of a smooth cut. Baked once, re-baked
// only around fresh digging, so the lit sand costs nothing per frame.
const soilFS = HEAD + NOISE + `
uniform sampler2D uMask; uniform vec2 uGrid,uWorld; uniform float uGrain,uTun,uGround,uGel;
uniform vec3 uA,uB,uDark,uPale,uKey,uFill,uBounce,uSkyT,uSkyB,uBokeh; uniform float uGain;
out vec4 o;
const vec3 L=normalize(vec3(-.36,-.72,.60));
struct G{vec2 c;float f1;float edge;float id;};
G grain(vec2 p,float s){
 vec2 w=vec2(vn(p/s*.7+3.1),vn(p/s*.7+8.4))-.5;p+=w*s*.75;
 vec2 q=p/s,ip=floor(q),fq=fract(q);float f1=9.,f2=9.;vec2 br=vec2(0),bc=vec2(0);
 for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(i,j),r=g+h22(ip+g)-fq;float d=dot(r,r);if(d<f1){f2=f1;f1=d;br=r;bc=ip+g;}else if(d<f2)f2=d;}
 f1=sqrt(f1);f2=sqrt(f2);G r;r.c=p+br*s;r.f1=f1;r.edge=f2-f1;r.id=h12(bc+11.7);return r;}
float maskR(vec2 p){return texture(uMask,p/uGrid).r;}
vec3 layerTint(vec2 p){
 if(uGel>1.5){float w=p.y+70.*fbm(p*vec2(.0026,.004))+22.*fbm(p*.012);float k=floor(w/86.);float f=h12(vec2(k,3.));
  vec3 c=f<.2?vec3(.62,.17,.10):f<.4?vec3(.13,.28,.55):f<.6?vec3(.86,.68,.24):f<.8?vec3(.16,.42,.26):vec3(.86,.78,.66);return c*1.7;}
 return vec3(1.);}
vec3 grainCol(float id,vec2 p){
 float zone=fbm(p*.012+21.);float t=fract(id*7.31);vec3 c=mix(uA,uB,t*t*(3.-2.*t));
 if(id<.07)c=mix(uDark,uA,fract(id*40.)*.6);
 else if(id>.985-.05*zone)c=mix(uB,uPale,.25+.55*fract(id*31.));
 else if(fract(id*53.)<.09)c*=vec3(1.16,.92,.76);
 else if(fract(id*91.)<.07)c*=vec3(.82,.84,.90);
 return c*layerTint(p);}
vec3 shadeGrain(G g,vec2 p,float s,float amb,float depthK){
 float bevel=smoothstep(.0,.30,g.edge);
 vec2 out2=(p-g.c)/s;float ol=length(out2)+1e-4;
 float tilt=(1.-bevel)*.95+.14*min(1.,ol*1.6);
 vec3 n=normalize(vec3(out2/ol*tilt,.62+.5*bevel));
 float m1=vn(p*.42+g.id*90.),m2=vn(p*.42+g.id*50.+7.),f1=vn(p*1.5+g.id*20.),f2=vn(p*1.5+g.id*33.);
 n.xy+=(vec2(m1,m2)-.5)*.62+(vec2(f1,f2)-.5)*.30;n=normalize(n);
 vec3 c=grainCol(g.id,g.c);c*=.86+.30*vn(p*.8+g.id*40.);
 float dif=max(0.,dot(n,L));
 float gap=smoothstep(.0,.05+.05*fract(g.id*29.),g.edge),ao=mix(.74,1.,smoothstep(.02,.30,g.edge));
 vec3 lit=c*(uFill*amb*(.46+.54*n.z)+uKey*dif*1.20*depthK+uBounce*.20*max(0.,n.y));
 float side=max(0.,-dot(normalize(n.xy+1e-3),normalize(L.xy)));
 lit+=c*c*uKey*.55*(1.-bevel)*side*depthK;
 lit+=c*uKey*.10*pow(bevel,3.)*depthK;
 vec3 H=normalize(L+vec3(0,0,1));bool mica=fract(g.id*17.)>.90;float sp=pow(max(0.,dot(n,H)),mica?220.:26.);
 lit+=uKey*sp*(mica?1.25:.07)*depthK;
 return lit*mix(.30+.34*vn(p*.7),1.,gap)*ao;}
vec3 sky(vec2 p){
 float g=smoothstep(0.,uGround,p.y);vec3 c=mix(uSkyT,uSkyB,g*g);
 float a=fbm(p*.0011+vec2(4.,9.)),b=fbm(p*.0023+vec2(13.,2.));
 c*=.62+.95*a;c=mix(c,c*vec3(1.22,1.02,.82),smoothstep(.4,.7,b));

 c=mix(c,c*vec3(1.06,.95,.82)*.72,smoothstep(uGround-90.,uGround,p.y));
 return c;}

let last = performance.now(), fps = 60, frames = 0, netT = 0, frameCount = 0;

    flushT -= dt; if (flushT <= 0) { flushT = .2; flushDirty(); }
    saveT -= dt; if (saveT <= 0) { saveT = 20; if (baked) saveColony(); }

// ---- the colony across browser windows: one window thinks, the others draw what it says
let channel = null, paneAnts = [], cid = hash.cid || '';

// ---- things you can do to the farm
function act(tool, x, y) {
  if (!LEADER) { channel && channel.postMessage({ t: 'act', tool, x, y }); return; }
  if (FOODS[tool]) dropFood(tool, x, y);
  else if (tool === 'tap') { const R = antLen * 8; for (const a of ants) { if (a.q) continue; const d = Math.hypot(a.x - x, a.y - y); if (d < R) { a.panic = rnd(1.6, 3.4) * (1 - d / R * .5); a.aim = Math.atan2(a.y - y, a.x - x); a.aimT = .1; a.a = a.aim + rnd(-.6, .6); } } shake = 1; }

  else if (tool === 'fill') { if (y > groundPx(x)) fill(x, y, tunR * 1.05); }

let shake = 0;

// ---- input and controls
const $ = (id) => document.getElementById(id);

const TOOLS = [['sugar', 'Sugar'], ['seeds', 'Seeds'], ['honey', 'Honey'], ['crumb', 'Crumbs'], ['water', 'Water'], null, ['tap', 'Tap glass'], ['dig', 'Dig'], ['fill', 'Fill in']];

let resetArmed = 0;

function worldAt(ev) {

// ---- browser screensaver mode and spreading over monitors (Chrome/Edge; one popup per click)
