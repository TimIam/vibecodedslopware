<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix Rain</title>
<meta name="description" content="The digital rain, on every screen you own. Click to take over all your monitors. Move the mouse to stop.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23000'/><text x='50' y='74' text-anchor='middle' font-size='66' font-family='monospace' fill='%2300ff41'>ｱ</text></svg>">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
body.saver{cursor:none}
#ui{position:fixed;inset:0;display:grid;place-items:center;padding:16px;font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;color:#b9d6c3;cursor:pointer;user-select:none;-webkit-user-select:none}
.card{background:rgba(0,10,4,.84);border:1px solid rgba(0,255,65,.3);border-radius:16px;padding:28px 32px;max-width:440px;text-align:center;box-shadow:0 0 80px rgba(0,255,65,.14)}
.card h1{margin:0 0 12px;font:600 13px/1 ui-monospace,Consolas,monospace;letter-spacing:.35em;color:#00ff41;text-transform:uppercase}
.card .big{font-size:22px;font-weight:600;color:#eafff0;margin:0 0 10px;line-height:1.25}
.card p{margin:8px 0 0;font-size:14px}
.card .note{color:#6f8f7b;font-size:12.5px}
body.saver #ui,body.embed #ui{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div class="card">
  <h1>Matrix Rain</h1>
  <div class="big" id="cta">Click to take over every screen</div>
  <p id="how">Move the mouse or press a key to stop.</p>
  <p class="note" id="note">Chrome and Edge can rain on all your monitors (you’ll be asked to allow it, then to click once per screen). Other browsers get this one.</p>
</div></div>
<script>
(() => {
'use strict';
// Modes, picked by the URL hash:
//   (none)     the page: rain + a card; click it to take over every screen
//   #saver     a window opened by the page on another screen; any input closes it
//   #embed     just rain, no card, no input handling (iframes, Mac web screensaver shells)
//   #backdrop  like #embed, but holds still when the viewer prefers reduced motion
const flags = new Set(location.hash.slice(1).split(/[,&]/).filter(Boolean));
const MODE = flags.has('saver') ? 'saver' : (flags.has('embed') || flags.has('backdrop')) ? 'embed' : 'page';
const STILL = flags.has('backdrop') && matchMedia('(prefers-reduced-motion: reduce)').matches;
if (MODE === 'embed') document.body.classList.add('embed');   // body.saver is added later, once input should stop the show

// ---- glyphs: half-width katakana (mirrored, like the film), digits, a few symbols
const GLYPHS = [];
for (let c = 0xFF71; c <= 0xFF9D; c++) GLYPHS.push([String.fromCharCode(c), true]);
for (const ch of 'ｦｰ') GLYPHS.push([ch, true]);
for (const ch of '0123456789Z:."=*+-<>|¦') GLYPHS.push([ch, false]);
const NG = GLYPHS.length;

// ---- colour: trail brightness in LEVELS steps, LEVELS itself is the white-hot head
const LEVELS = 28;
const STOPS = [[0, [0, 12, 3]], [.2, [0, 72, 20]], [.5, [0, 165, 44]], [.8, [0, 255, 65]], [1, [160, 255, 180]]];
function ramp(t) {
  let i = 1; while (i < STOPS.length - 1 && STOPS[i][0] < t) i++;
  const [a, ca] = STOPS[i - 1], [b, cb] = STOPS[i], k = Math.max(0, Math.min(1, (t - a) / (b - a)));
  return ca.map((v, j) => Math.round(v + (cb[j] - v) * k));
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
const rnd = Math.random;
let W, H, cw, ch, cols, rows, grid, drops, atlas, glow;

// Every glyph at every brightness, drawn once; frames are then just drawImage calls.
function buildAtlas(dpr) {
  const fontPx = Math.round(Math.max(14, Math.min(24, innerHeight / 60)) * dpr);
  cw = Math.round(fontPx * 0.64); ch = Math.round(fontPx * 1.1);
  atlas = document.createElement('canvas'); atlas.width = cw * NG; atlas.height = ch * (LEVELS + 1);
  const g = atlas.getContext('2d');
  g.font = `${fontPx}px "MS Gothic","Osaka-Mono","Hiragino Kaku Gothic ProN","Noto Sans Mono CJK JP","Noto Sans CJK JP","Yu Gothic",monospace`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let l = 0; l <= LEVELS; l++) {
    g.fillStyle = `rgb(${l === LEVELS ? [225, 255, 235] : ramp(l / (LEVELS - 1))})`;
    for (let i = 0; i < NG; i++) {
      g.save(); g.translate(i * cw + cw / 2, l * ch + ch / 2);
      if (GLYPHS[i][1]) g.scale(-1, 1);
      g.fillText(GLYPHS[i][0], 0, fontPx * 0.04); g.restore();
    }
  }
  glow = document.createElement('canvas'); glow.width = cw * 3; glow.height = ch * 3;
  const gg = glow.getContext('2d'), r = gg.createRadialGradient(cw * 1.5, ch * 1.5, 0, cw * 1.5, ch * 1.5, ch * 1.4);
  r.addColorStop(0, 'rgba(120,255,160,.4)'); r.addColorStop(1, 'rgba(0,255,65,0)');
  gg.fillStyle = r; gg.fillRect(0, 0, glow.width, glow.height);
}

function newDrop(c, y) {
  return { c, y, last: Math.floor(y), speed: 6 + rnd() * 12, len: 10 + (rnd() * 22 | 0), gain: rnd() < 0.3 ? 0.4 + rnd() * 0.3 : 0.75 + rnd() * 0.25 };
}

function layout() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = cv.width = Math.max(1, Math.round(innerWidth * dpr)); H = cv.height = Math.max(1, Math.round(innerHeight * dpr));
  buildAtlas(dpr);
  cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
  grid = new Uint8Array(cols * rows);
  for (let i = 0; i < grid.length; i++) grid[i] = rnd() * NG | 0;
  drops = [];
  for (let c = 0; c < cols; c++) { drops.push(newDrop(c, -rnd() * rows * 1.2)); drops.push(newDrop(c, -rows * 1.5 - rnd() * rows * 3)); }
}

function step(dt) {
  for (const d of drops) {
    d.y += d.speed * dt;
    const h = Math.floor(d.y);
    if (h !== d.last) {                       // the head reveals a fresh glyph in each row it enters
      for (let r = d.last + 1; r <= h; r++) if (r >= 0 && r < rows) grid[d.c * rows + r] = rnd() * NG | 0;
      d.last = h;
    }
    if (h - d.len > rows) Object.assign(d, newDrop(d.c, -rnd() * rows * 2 - 2));
  }
  for (let i = Math.ceil(grid.length * 0.003); i > 0; i--) grid[rnd() * grid.length | 0] = rnd() * NG | 0;   // shimmer
}

function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (const d of drops) {
    const h = Math.floor(d.y);
    if (h < 0 || h >= rows || d.gain < 0.7) continue;
    ctx.globalAlpha = d.gain; ctx.drawImage(glow, d.c * cw - cw, h * ch - ch);
  }
  ctx.globalAlpha = 1;
  for (const d of drops) {
    const h = Math.floor(d.y), base = d.c * rows;
    for (let k = 0; k < d.len; k++) {
      const r = h - k;
      if (r < 0) break;
      if (r >= rows) continue;
      let l;
      if (k === 0) l = d.gain > 0.7 ? LEVELS : LEVELS - 2;
      else { l = Math.round(Math.pow(1 - k / d.len, 1.4) * d.gain * (LEVELS - 1)); if (l < 1) continue; }
      ctx.drawImage(atlas, grid[base + r] * cw, l * ch, cw, ch, d.c * cw, r * ch, cw, ch);
    }
  }
}

let last = performance.now(), resizeT = 0;
function reset() { layout(); for (let i = 0; i < 150; i++) step(1 / 30); if (STILL) render(); }   // start mid-storm, not with an empty sky
function frame(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; step(dt); render(); requestAnimationFrame(frame); }
reset();
if (!STILL) requestAnimationFrame(frame);
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(reset, 120); });

if (MODE === 'embed') return;

// ---- taking over the screens
// Chrome lets one click do one thing: open one popup window, or go fullscreen. So the page spends
// a click per extra screen opening a window there, one more to fill its own screen, and each of
// those windows fills its screen on a click of its own. Nothing watches the mouse until every
// window is in place; after that, any input anywhere shuts the whole thing down.
const ui = document.getElementById('ui'), cta = document.getElementById('cta'), how = document.getElementById('how'), note = document.getElementById('note');
const canMulti = !!(window.getScreenDetails && screen.isExtended);
if (MODE === 'page' && !window.getScreenDetails) note.textContent = 'This browser can only rain on this screen. Chrome or Edge can do all of them.';
const ORIGIN = location.origin === 'null' ? '*' : location.origin;   // file:// has no origin to pin to
const ours = (e) => e.origin === location.origin && e.data && typeof e.data.t === 'string';
const say = (big, small) => { cta.textContent = big; if (small != null) how.textContent = small; };
let details = null, queue = [], popups = [], ready = new Set(), full = false, armed = false, armAt = 0, origin = null;

// Any input stops it, except the click that got us here and the mouse jitter a fullscreen switch produces.
function arm(delay) {
  armed = true; armAt = performance.now() + delay; origin = null;
  document.body.classList.add('saver');
  addEventListener('mousemove', onMove); addEventListener('mousedown', onInput); addEventListener('keydown', onInput);
  addEventListener('wheel', onInput, { passive: true }); addEventListener('touchstart', onInput, { passive: true });
}
function disarm() {
  armed = false; document.body.classList.remove('saver');
  removeEventListener('mousemove', onMove); removeEventListener('mousedown', onInput); removeEventListener('keydown', onInput);
  removeEventListener('wheel', onInput); removeEventListener('touchstart', onInput);
}
function onMove(e) {
  if (performance.now() < armAt) return;
  if (!origin) { origin = [e.screenX, e.screenY]; return; }
  if (Math.hypot(e.screenX - origin[0], e.screenY - origin[1]) > 12) stop();
}
function onInput() { if (performance.now() >= armAt) stop(); }

async function fill() {
  try { await document.documentElement.requestFullscreen(); } catch (e) {}   // no fullscreen? it still rains
  full = true;
}

function stop() {
  disarm();
  full = false;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (MODE === 'saver') { say('Click to fill this screen'); try { window.close(); } catch (e) {} return; }
  for (const w of popups) try { w.close(); } catch (e) {}
  popups = []; ready.clear();
  queue = details ? details.screens.filter(s => s !== details.currentScreen) : [];
  say('Click to take over every screen again', 'Move the mouse or press a key to stop.');
}

if (MODE === 'saver') {
  say('Click to fill this screen', 'Then, once every screen is in, move the mouse or press a key to stop.');
  async function go() {
    if (full) return;
    await fill();
    if (window.opener && !window.opener.closed) { say('Waiting for the other screens…'); window.opener.postMessage({ t: 'ready' }, ORIGIN); }
    else arm(900);
  }
  ui.addEventListener('click', go);
  addEventListener('keydown', (e) => { if (!armed && (e.key === 'Enter' || e.key === ' ')) go(); });
  addEventListener('message', (e) => { if (ours(e) && e.source === window.opener && e.data.t === 'arm') arm(1200); });
  document.addEventListener('fullscreenchange', () => { if (full && !document.fullscreenElement) stop(); });   // Esc
  setInterval(() => { if (window.opener && window.opener.closed) stop(); }, 500);
} else {
  async function go() {
    if (full) return;   // this screen is done; the others are waiting on their own clicks
    if (canMulti && !details) {
      const t0 = performance.now();
      try { details = await window.getScreenDetails(); } catch (e) { details = false; }   // declined: this screen only
      if (details) queue = details.screens.filter(s => s !== details.currentScreen);
      if (performance.now() - t0 > 4000) {   // the permission prompt ate the click; the next one does the work
        say(details ? `Allowed: ${details.screens.length} screens. Click again.` : 'This screen only. Click again.');
        return;
      }
    }
    if (queue.length) {
      const s = queue.shift(), target = location.href.replace(/#.*$/, '') + '#saver';
      const w = window.open(target, '_blank', `popup,left=${s.availLeft},top=${s.availTop},width=${s.availWidth},height=${s.availHeight}`);
      if (w) popups.push(w);
      const n = details.screens.length, opened = n - queue.length;
      say(queue.length ? `Screen ${opened} of ${n} opened. Click again.` : `All ${n} screens opened. Click again to fill this one.`,
          'A window is waiting on each screen.');
      return;
    }
    await fill();
    if (!popups.length) { arm(900); return; }
    say('Now click once on each of the other screens.', 'Then any movement stops it all.');
    check();
  }
  // Everyone arms together, once this screen and every open popup are fullscreen.
  function check() {
    if (!full || armed) return;
    popups = popups.filter(w => !w.closed);
    if (!popups.every(w => ready.has(w))) return;
    for (const w of popups) w.postMessage({ t: 'arm' }, ORIGIN);
    arm(1200);
  }
  ui.addEventListener('click', go);
  addEventListener('keydown', (e) => { if (!armed && (e.key === 'Enter' || e.key === ' ')) go(); });
  addEventListener('message', (e) => { if (ours(e) && popups.includes(e.source) && e.data.t === 'ready') { ready.add(e.source); check(); } });
  document.addEventListener('fullscreenchange', () => { if (full && !document.fullscreenElement) stop(); });   // Esc
  setInterval(() => { if (armed) { if (popups.some(w => w.closed)) stop(); } else check(); }, 300);   // one window stops, they all stop
}
})();
</script>
</body>
</html>
